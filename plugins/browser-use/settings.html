<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Use — Settings</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #2f81f7;
    --accent-dim: #1f6feb;
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    padding: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  h2 { font-size: 15px; font-weight: 600; margin: 24px 0 12px; color: var(--text); }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .status-bar {
    display: flex; gap: 16px; flex-wrap: wrap;
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 20px;
    font-size: 13px;
  }
  .status-item { display: flex; flex-direction: column; }
  .status-item .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .status-item .value { font-family: var(--mono); font-size: 13px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .pill.ok { background: rgba(63,185,80,0.15); color: var(--green); }
  .pill.warn { background: rgba(210,153,34,0.15); color: var(--amber); }
  .pill.err { background: rgba(248,81,73,0.15); color: var(--red); }
  .card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin-bottom: 12px;
  }
  .card.active { border-color: var(--accent); }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card-title { font-weight: 600; font-size: 14px; }
  .card-title .type { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .card-meta { color: var(--text-dim); font-size: 12px; font-family: var(--mono); margin-bottom: 12px; word-break: break-all; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  label { color: var(--text-dim); font-size: 12px; }
  input[type="text"], input[type="password"], select {
    background: var(--bg-3); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 6px 10px;
    font-size: 13px; font-family: var(--mono); flex: 1; min-width: 180px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--bg-3); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 6px 12px;
    font-size: 13px; cursor: pointer; font-family: var(--sans);
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: var(--border); }
  button.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
  button.primary:hover { background: var(--accent); }
  button.danger { color: var(--red); }
  button.danger:hover { border-color: var(--red); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .models { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .model-chip {
    font-family: var(--mono); font-size: 11px; padding: 3px 8px;
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; color: var(--text-dim);
  }
  .model-chip:hover { border-color: var(--accent); color: var(--text); }
  .model-chip.selected { border-color: var(--accent); color: var(--text); background: rgba(47,129,247,0.12); }
  .feedback { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .feedback.ok { color: var(--green); }
  .feedback.err { color: var(--red); }
  .feedback.info { color: var(--text-dim); }
  .key-status { font-size: 12px; font-family: var(--mono); }
  .key-status.set { color: var(--green); }
  .key-status.unset { color: var(--amber); }
  .add-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .add-form .full { grid-column: 1 / -1; }
  .hidden { display: none; }
  .section-note { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>Browser Use — Settings</h1>
  <div class="subtitle">Manage LLM providers and API keys. Keys are stored in <code>data/secrets.json</code> (gitignored).</div>

  <div class="status-bar" id="statusBar">
    <div class="status-item"><span class="label">Active Provider</span><span class="value" id="activeProvider">—</span></div>
    <div class="status-item"><span class="label">Active Model</span><span class="value" id="activeModel">—</span></div>
    <div class="status-item"><span class="label">Server</span><span class="value" id="serverStatus"><span class="pill warn">checking…</span></span></div>
  </div>

  <h2>Providers</h2>
  <div id="providers"></div>

  <h2>Add Provider</h2>
  <div class="section-note">For NVIDIA / OpenCode Go / any OpenAI-compatible endpoint, use type <code>openai-compatible</code>.</div>
  <div class="card">
    <div class="add-form">
      <div><label>ID (slug)</label><input type="text" id="addId" placeholder="e.g. my-provider"></div>
      <div><label>Type</label>
        <select id="addType">
          <option value="openai-compatible">openai-compatible</option>
          <option value="openai">openai</option>
          <option value="openrouter">openrouter</option>
          <option value="anthropic">anthropic</option>
          <option value="google">google</option>
          <option value="deepseek">deepseek</option>
          <option value="groq">groq</option>
          <option value="ollama">ollama</option>
          <option value="mistral">mistral</option>
          <option value="cerebras">cerebras</option>
          <option value="litellm">litellm</option>
          <option value="vercel">vercel</option>
          <option value="azure">azure</option>
          <option value="aws">aws</option>
          <option value="browser-use">browser-use</option>
        </select>
      </div>
      <div><label>Name</label><input type="text" id="addName" placeholder="e.g. My Provider"></div>
      <div><label>Base URL</label><input type="text" id="addBaseUrl" placeholder="https://api.example.com/v1"></div>
      <div class="full"><label>Models (comma-separated)</label><input type="text" id="addModels" placeholder="model-a, model-b"></div>
      <div class="full"><button class="primary" id="addBtn">Add Provider</button> <span class="feedback" id="addFeedback"></span></div>
    </div>
  </div>

<script>
const API = '';
const $ = (id) => document.getElementById(id);

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  return res.json();
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

let state = { providers: [], active_provider: null, active_model: null };

async function load() {
  try {
    const [providersRes, llmRes, statusRes] = await Promise.all([
      api('/api/providers'),
      api('/api/llm/status'),
      api('/api/status'),
    ]);
    state.providers = providersRes.providers || [];
    state.active_provider = providersRes.active_provider;
    state.active_model = providersRes.active_model;
    renderStatus(llmRes, statusRes);
    renderProviders();
  } catch (err) {
    $('serverStatus').innerHTML = '<span class="pill err">offline</span>';
    $('providers').innerHTML = '<div class="card">Could not reach the server. Is it running on port 4105?</div>';
  }
}

function renderStatus(llmRes, statusRes) {
  $('activeProvider').textContent = llmRes.active_provider || '—';
  $('activeModel').textContent = llmRes.active_model || '—';
  const installed = statusRes.browser_use_installed;
  $('serverStatus').innerHTML = installed
    ? '<span class="pill ok">running</span>'
    : '<span class="pill warn">stub mode (browser-use not installed)</span>';
}

function renderProviders() {
  const container = $('providers');
  container.innerHTML = '';
  if (state.providers.length === 0) {
    container.innerHTML = '<div class="card">No providers configured.</div>';
    return;
  }
  for (const p of state.providers) {
    container.append(renderProviderCard(p));
  }
}

function renderProviderCard(p) {
  const isActive = p.id === state.active_provider;
  const card = el('div', { class: 'card' + (isActive ? ' active' : '') });

  const header = el('div', { class: 'card-header' });
  const title = el('span', { class: 'card-title', text: p.name });
  title.append(el('span', { class: 'type', text: p.type }));
  const activePill = isActive ? el('span', { class: 'pill ok', text: 'ACTIVE' }) : el('span');
  header.append(title, activePill);

  const meta = el('div', { class: 'card-meta', text: p.baseUrl || '(no base URL)' });

  // API key row
  const keyRow = el('div', { class: 'row' });
  const keyLabel = el('label', { text: 'API key' });
  const keyInput = el('input', { type: 'password', placeholder: p.has_key ? '•••••••• (set)' : 'Enter API key…' });
  const keyStatus = el('span', { class: 'key-status ' + (p.has_key ? 'set' : 'unset'), text: p.has_key ? '✓ set' : 'not set' });
  const saveKeyBtn = el('button', { class: 'primary', text: 'Save key' });
  const clearKeyBtn = el('button', { class: 'danger', text: 'Clear' });
  const keyFeedback = el('div', { class: 'feedback' });

  saveKeyBtn.addEventListener('click', async () => {
    const key = keyInput.value.trim();
    if (!key) { keyFeedback.className = 'feedback err'; keyFeedback.textContent = 'Enter a key first'; return; }
    saveKeyBtn.disabled = true;
    const r = await api(`/api/providers/${p.id}/key`, { method: 'POST', body: JSON.stringify({ apiKey: key }) });
    saveKeyBtn.disabled = false;
    if (r.success) {
      keyFeedback.className = 'feedback ok'; keyFeedback.textContent = 'Key saved';
      keyInput.value = ''; keyStatus.textContent = '✓ set'; keyStatus.className = 'key-status set';
      p.has_key = true;
    } else {
      keyFeedback.className = 'feedback err'; keyFeedback.textContent = r.error || 'Failed';
    }
  });

  clearKeyBtn.addEventListener('click', async () => {
    const r = await api(`/api/providers/${p.id}/key`, { method: 'DELETE' });
    if (r.success) {
      keyFeedback.className = 'feedback ok'; keyFeedback.textContent = 'Key removed';
      keyInput.value = ''; keyStatus.textContent = 'not set'; keyStatus.className = 'key-status unset';
      p.has_key = false;
    }
  });

  keyRow.append(keyLabel, keyInput, keyStatus, saveKeyBtn, clearKeyBtn);

  // Models row
  const modelsLabel = el('label', { text: 'Models' });
  const modelsDiv = el('div', { class: 'models' });
  for (const m of (p.models || [])) {
    const chip = el('span', { class: 'model-chip' + (m === state.active_model && isActive ? ' selected' : ''), text: m });
    chip.addEventListener('click', async () => {
      const r = await api('/api/llm/select', { method: 'POST', body: JSON.stringify({ providerId: p.id, model: m }) });
      if (r.success) { state.active_provider = p.id; state.active_model = m; load(); }
    });
    modelsDiv.append(chip);
  }

  // Actions row
  const actionsRow = el('div', { class: 'row' });
  const testBtn = el('button', { text: 'Test connection' });
  const testFeedback = el('div', { class: 'feedback' });
  testBtn.addEventListener('click', async () => {
    testBtn.disabled = true;
    testFeedback.className = 'feedback info'; testFeedback.textContent = 'Testing…';
    const r = await api(`/api/providers/${p.id}/test`, { method: 'POST' });
    testBtn.disabled = false;
    if (r.success) { testFeedback.className = 'feedback ok'; testFeedback.textContent = '✓ Connected'; }
    else { testFeedback.className = 'feedback err'; testFeedback.textContent = '✗ ' + (r.error || 'Failed'); }
  });
  actionsRow.append(testBtn, testFeedback);

  card.append(header, meta, keyRow, keyFeedback, modelsLabel, modelsDiv, actionsRow);
  return card;
}

$('addBtn').addEventListener('click', async () => {
  const id = $('addId').value.trim();
  const type = $('addType').value;
  const name = $('addName').value.trim();
  const baseUrl = $('addBaseUrl').value.trim();
  const models = $('addModels').value.split(',').map(s => s.trim()).filter(Boolean);
  const fb = $('addFeedback');
  if (!id || !name) { fb.className = 'feedback err'; fb.textContent = 'ID and name are required'; return; }
  const r = await api('/api/providers', { method: 'POST', body: JSON.stringify({ id, type, name, baseUrl, models }) });
  if (r.success || r.provider) {
    fb.className = 'feedback ok'; fb.textContent = 'Provider added';
    $('addId').value = ''; $('addName').value = ''; $('addBaseUrl').value = ''; $('addModels').value = '';
    load();
  } else {
    fb.className = 'feedback err'; fb.textContent = r.error || 'Failed';
  }
});

load();
</script>
</body>
</html>
